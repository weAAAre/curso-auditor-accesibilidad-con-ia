<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lúmina Store — Entrega</title>
    <link rel="stylesheet" href="../assets/site.css" />
    <script src="../assets/site.js" defer></script>
  </head>
  <body>
    <header><a href="../index.html"><strong>Lúmina Store</strong></a></header>
    <main>
      <h1>Datos de entrega</h1>
      <div id="delivery-errors" class="errors" hidden>Revisa los campos marcados.</div>
      <form id="delivery-form">
        <label for="name">Nombre</label>
        <input id="name" autocomplete="name" />
        <span>Dirección</span>
        <input id="address" autocomplete="street-address" />
        <button id="continue" type="submit">Continuar al resumen</button>
      </form>
      <p><a href="confirmation.html">Ver confirmación de demostración</a></p>
    </main>
  </body>
</html>
